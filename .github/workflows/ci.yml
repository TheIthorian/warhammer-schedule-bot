name: CI

on:
    push:
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_DB: gm_sidekick
                    POSTGRES_USER: root
                    POSTGRES_PASSWORD: password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U root -d gm_sidekick"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            NODE_ENV: test
            DATABASE_URL: postgresql://root:password@localhost:5432/gm_sidekick
            TEST_DATABASE_URL: postgresql://root:password@localhost:5432/gm_sidekick
            BOT_TOKEN: fake-bot-token-for-ci
            APPLICATION_ID: fake-application-id-for-ci
            PUBLIC_KEY: fake-public-key-for-ci
            CLIENT_ID: fake-client-id-for-ci
            CLIENT_SECRET: fake-client-secret-for-ci

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11.1.3

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Typecheck
              run: pnpm exec tsc --noEmit

            - name: Apply migrations
              run: pnpm exec prisma migrate deploy

            - name: Test
              run: pnpm test
